name: contracts-and-isolation
on: [push, pull_request]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --locked
      - run: make check
      - run: make demo-replay
      - run: make eval-suite
      - run: make sandbox-build
      - run: make sandbox-smoke
      - run: make demo-isolated
